<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add quiz</title>
    <style>
    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
    }
    html,body{
        height: 100%;
        width: 100%;
    }
    #main{
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #box{
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 200px;
        width: 400px;
        height: 400px;
        background-color: cornsilk;
    }
    #description{
        height: 60px;
    }
    #Submit{
        width: 60px;
    }
    button{
        width: 60px;
    }
    </style>
</head>
<body>
    <div id="main">
        <div id="box">
            <form action="/add_quiz/quiz" method="post">
                <label for="chid">Chapter_ID : &nbsp</label>
                <input type="text" id="chid" name="chid"><br><br>
                 <label for="date">Date :</label>
                 <input type="date" name="date" id="date" min="2000-01-01" max="2125-01-01"><br><br>
                 <label for="time">Duration :</label>
                 <input type="time" name="time" id="time"><br><br>
                 <label for="remark">Rrmark :</label>
                 <input type="text" id="remark" name="remark"><br><br>
                <input type="submit" value="save" id="Submit">&nbsp &nbsp &nbsp &nbsp &nbsp 
                <button><a href="/quizmg">cancel</a></button>
                {%if again%}
            Chapter id is not there
            {%endif%}
            {%if succes%}
            saved successfully
            {%endif%}
            </form>
        </div>
        
    </div>
</body>
</html>
