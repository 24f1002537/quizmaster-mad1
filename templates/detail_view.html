<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add quiz</title>
    <style>
    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
    }
    html,body{
        height: 100%;
        width: 100%;
    }
    #main{
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #box{
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 200px;
        width: 400px;
        height: 400px;
        background-color: cornsilk;
    }
    .innerbox{
            margin-left: 10px;
            border: 1px solid black;
            background-color: blanchedalmond;
            color: crimson;
            text-decoration-color: aliceblue;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="box">
            <div>
                <p>ID : &nbsp  {{a[0][0][0]}}</p>
                <p>Subject : {{a[2][0][1]}}</p>
                <p>Chapter : {{a[2][0][0]}} </p>
                <p>Number of question : {{a[1][0][0]}} </p>
                <p>Sheduled date : {{a[0][0][2]}}</p>
                <p>Duration(hh:mm) : {{a[0][0][3]}}</p>
                <a class="innerbox" href="/user/{{b}}">close</a>
            </div>
        </div>
    </div>
</body>
</html>
